name: Enviar Correos

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de corrida del scraper (YYYY-MM-DD). Vacío = la más reciente en el Sheet'
        required: false
        default: ''
      asunto:
        description: 'Asunto del correo (se le agrega la fecha automáticamente)'
        required: true
        default: 'Boletín de Normas Legales'
      dry_run:
        description: 'Modo prueba - no envía nada si es true'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      remitente:
        description: 'Nombre visible del remitente'
        required: false
        default: 'Boletín de Normas'
      limite:
        description: 'Enviar solo a los primeros N contactos (0 = todos)'
        required: false
        default: '0'

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      # NUEVO: arma el boletín con las normas que el scraper guardó en el Sheet
      - name: Generar boletín desde el Sheet
        id: generar
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FECHA: ${{ github.event.inputs.fecha }}
        run: |
          python generar_boletin.py \
            --plantilla boletin_plantilla.html \
            --salida boletin_generado.html \
            --fecha "$FECHA"

      - name: Ejecutar envío
        if: steps.generar.outputs.hay_normas == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ASUNTO: ${{ github.event.inputs.asunto }}
          FECHA_TXT: ${{ steps.generar.outputs.fecha_txt }}
          REMITENTE: ${{ github.event.inputs.remitente }}
          LIMITE: ${{ github.event.inputs.limite }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python enviar_correos.py \
            --html boletin_generado.html \
            --asunto "$ASUNTO - $FECHA_TXT" \
            --remitente "$REMITENTE" \
            --limite "${LIMITE:-0}" \
            $EXTRA

      - name: Sin normas para enviar
        if: steps.generar.outputs.hay_normas != 'true'
        run: echo "No hay normas en el Sheet para esa fecha; no se envió ningún correo."

      # Para revisar el boletín generado (sirve sobre todo en dry-run)
      - name: Guardar boletín generado
        if: steps.generar.outputs.hay_normas == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boletin-generado
          path: boletin_generado.html
