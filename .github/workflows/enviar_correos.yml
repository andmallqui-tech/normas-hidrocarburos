name: Enviar Correos

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha del boletín (YYYY-MM-DD). Solo se envía lo con S de ese día. Vacío = hoy (Lima)'
        required: false
        default: ''
      asunto:
        description: 'Asunto del correo (se le agrega la fecha automáticamente)'
        required: true
        default: 'Boletín de Normas Legales'
      remitente:
        description: 'Nombre visible del remitente'
        required: false
        default: 'Boletín de Normas'
      limite:
        description: 'Enviar solo a los primeros N contactos (0 = todos)'
        required: false
        default: '0'

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      # enviar_correos.py arma el HTML directamente desde la plantilla + el Sheet
      # (S del día + ENVIADO vacío). Ya no depende de generar_boletin.py.
      - name: Ejecutar envío
        id: enviar
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ASUNTO: ${{ github.event.inputs.asunto }}
          FECHA: ${{ github.event.inputs.fecha }}
          REMITENTE: ${{ github.event.inputs.remitente }}
          LIMITE: ${{ github.event.inputs.limite }}
        run: |
          python enviar_correos.py \
            --html boletin_plantilla.html \
            --asunto "$ASUNTO" \
            --fecha "$FECHA" \
            --remitente "$REMITENTE" \
            --limite "${LIMITE:-0}"
