# Guardar en: .github/workflows/proyectos_energia.yml
name: Proyectos de ley de energia (Congreso)

on:
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
    inputs:
      ficha:
        description: 'Opcional: enviar por Telegram la ficha completa de un proyecto (ej. 14288)'
        required: false
        default: ""
      completa:
        description: 'Leer TODAS las fichas (si no, sólo nuevos y con cambio de estado; el primer lunes del mes siempre es completa)'
        type: boolean
        default: false
      sin_alertas:
        description: 'Actualizar la hoja SIN enviar Telegram (útil para reiniciar la línea base)'
        type: boolean
        default: false
  schedule:
    - cron: "0 13 * * 1"      # lunes 8:00 a.m. hora de Lima

concurrency:
  group: proyectos-energia    # evita dos corridas a la vez
  cancel-in-progress: false

jobs:
  proyectos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: pip install requests pandas selenium beautifulsoup4 pycryptodome google-api-python-client google-auth

      - name: Descargar, filtrar y detectar cambios
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_SIZE: "500"
          SUMILLA_EN_ALERTAS: "nuevos"    # "nuevos" o "todas"
          FICHA_PEDIDO: ${{ github.event.inputs.ficha }}
          COMPLETA: ${{ github.event.inputs.completa }}
          SIN_ALERTAS: ${{ github.event.inputs.sin_alertas }}
        run: python proyectos_energia_github.py

      - name: Guardar archivos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proyectos-energia-diagnostico
          path: |
            api_spley_capturada.json
            ficha_muestra.html
            ficha_ver_mas_muestra.html
