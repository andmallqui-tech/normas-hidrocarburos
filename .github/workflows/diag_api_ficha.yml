# Guardar en: .github/workflows/diag_api_ficha.yml  (se corre a mano, dura ~2 min)
name: Diagnostico API de la ficha 2
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
      - run: pip install selenium requests
      - run: python diag_api_ficha2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-api-ficha2
          path: diag_api_ficha2.json
